[package]
name = "ergalics-core"
version = "0.1.0"
edition = "2021"
description = "Ergalics Studio native core (WebGPU device management, compute scheduler)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Navigator",
  "Gpu",
  "GpuAdapter",
  "GpuAdapterInfo",
  "GpuDevice",
  "GpuBuffer",
  "GpuQueue",
  "GpuCommandEncoder",
  "GpuCommandBuffer",
  "GpuShaderModule",
  "GpuShaderModuleDescriptor",
  "GpuComputePipeline",
  "GpuComputePipelineDescriptor",
  "GpuBindGroup",
  "GpuBindGroupLayout",
  "GpuBindGroupLayoutDescriptor",
  "GpuBindGroupLayoutEntry",
  "GpuPipelineLayout",
  "GpuPipelineLayoutDescriptor",
  "GpuBufferDescriptor",
  "GpuRequestAdapterOptions",
  "GpuPowerPreference",
  "GpuProgrammableStage",
  "GpuUncapturedErrorEvent",
  "GpuError",
  "GpuOutOfMemoryError",
  "GpuValidationError",
] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
