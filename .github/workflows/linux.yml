name: Linux Packages

# Builds AppImage + deb from the same Electron renderer used by the web and
# Windows editions. Linux targets must be built on Linux; no signing required.
# Tagged releases attach these artifacts from the `release` workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Stub native module for web build (no Rust in CI)
        run: node scripts/make-wasm-stub.mjs

      - name: Build web app
        run: npm run build:web
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/app/docs/

      - name: Install Linux packaging deps
        run: npm ci --prefix deploy/linux

      - name: Build AppImage + deb (reuse the renderer build above)
        run: node scripts/linux-build.mjs --from-dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ergalics-linux-packages
          path: |
            deploy/linux/release/*.AppImage
            deploy/linux/release/*.deb
          if-no-files-found: error
