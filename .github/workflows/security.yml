name: Security (FR-18)

# Engineering-scorecard, SBOM and dependency-audit gate. Blocking rule:
# pnpm audit findings at high/critical fail the job and block the merge.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-score even without code changes (03:00 Mondays, UTC).
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecards:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: OSSF Scorecards analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          repo: ${{ github.repository }}
          ref: ${{ github.sha }}
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload scorecards SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecards-results
          path: results.sarif
          retention-days: 30

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # CycloneDX 1.5 generated from pnpm-lock.yaml v9 by a dependency-free
      # Node script.
      - name: Generate SBOM
        run: node scripts/gen-sbom.mjs sbom/cyclonedx.sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/cyclonedx.sbom.json
          retention-days: 90

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high/critical blocking)
        run: |
          AUDIT_ALLOWLIST=""
          set +e
          pnpm audit --audit-level=high --json > audit.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            node - "$AUDIT_ALLOWLIST" <<'EOF'
          const fs = require('node:fs');
          const allow = new Set((process.argv[2] || '').split(/\s+/).filter(Boolean));
          const data = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const advisories = data.advisories ?? {};
          const blocking = [];
          for (const adv of Object.values(advisories)) {
            if (adv && (adv.severity === 'high' || adv.severity === 'critical')) {
              const id = adv.github_advisory_id ?? adv.url?.match(/GHSA-[a-z0-9-]+/i)?.[0] ?? `${adv.module_name}:${adv.title}`;
              if (!allow.has(id)) blocking.push(`${adv.module_name}: ${id} (${adv.severity})`);
            }
          }
          if (blocking.length) {
            console.error('Blocking advisories (exempt via AUDIT_ALLOWLIST with justification):');
            for (const b of blocking) console.error('  - ' + b);
            process.exit(1);
          }
          console.log('All high/critical findings are allow-listed; downgraded to warnings.');
          EOF
            exit $?
          fi
          echo "pnpm audit: no high/critical findings."

      - name: Write audit report
        if: always()
        run: |
          mkdir -p audit-report
          cp audit.json audit-report/pnpm-audit.json 2>/dev/null || echo '{"error":"audit.json missing"}' > audit-report/pnpm-audit.json
          pnpm audit --audit-level=high > audit-report/pnpm-audit.txt 2>&1 || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report/
          retention-days: 90
